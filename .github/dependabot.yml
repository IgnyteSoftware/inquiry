version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CI fails these bumps until eng/release-manifest.json is edited to match by hand.
      # Group them apart, ahead of patch-and-minor, so they do not block other updates.
      release-manifest:
        update-types: ["minor", "patch"]
        patterns:
          - "Microsoft.Data.SqlClient"
          - "Microsoft.Data.Sqlite"
          - "Microsoft.Extensions.*"
          - "MySqlConnector"
          - "Npgsql"
          - "OpenTelemetry.Extensions.Hosting"
          - "Oracle.ManagedDataAccess.Core"
          - "Respawn"
          - "SQLitePCLRaw.lib.e_sqlite3"
          - "System.Configuration.ConfigurationManager"
          - "System.Security.Cryptography.Pkcs"
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # The source generator's Roslyn reference is a compatibility FLOOR, not a currency
      # target: raising it drops support for consumers on older SDK/IDE Roslyn versions.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.Common
      # The EF Core family is a pinned comparison cohort for the DLG benchmarks;
      # it moves wholesale in a deliberate benchmarks refresh, and
      # its provider packages must share a major version.
      - dependency-name: Microsoft.EntityFrameworkCore*
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
      - dependency-name: Pomelo.EntityFrameworkCore.MySql
      - dependency-name: Oracle.EntityFrameworkCore
      # The dotnet-ef tool must match that cohort's major version, so it moves with it.
      - dependency-name: dotnet-ef
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # RepoDB packages share one version, and RepoDb.Oracle holds the family at 1.16
      # (see Directory.Packages.props).
      - dependency-name: RepoDb*
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # These packages are versioned with .NET and ship in the release manifest. A new major
      # raises the dependency floor of the lowest target framework, which is a release decision
      # made by hand together with eng/release-manifest.json.
      - dependency-name: Microsoft.Extensions.*
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.Data.Sqlite
        update-types: ["version-update:semver-major"]
      - dependency-name: System.Configuration.ConfigurationManager
        update-types: ["version-update:semver-major"]
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
