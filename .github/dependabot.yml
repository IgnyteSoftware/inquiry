version: 2
updates:
  # Keep SHA-pinned actions from rotting: Dependabot updates the pin and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The source generator's Roslyn reference is a compatibility FLOOR, not a currency
      # target: raising it drops support for consumers on older SDK/IDE Roslyn versions.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.Common
      # The EF Core family is a pinned comparison cohort for the DLG benchmarks with
      # committed baselines; it moves wholesale in a deliberate benchmarks refresh, and
      # its provider packages must share a major version.
      - dependency-name: Microsoft.EntityFrameworkCore*
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
      - dependency-name: Pomelo.EntityFrameworkCore.MySql
      - dependency-name: Oracle.EntityFrameworkCore
