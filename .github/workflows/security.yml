name: Security

# PRs get scanned before merge; the weekly schedule refreshes the default-branch baseline.
# No push trigger — a push-to-main run would duplicate the PR scan that just gated the merge.
on:
  pull_request:
    # Trunk-based: every change PRs into main, so scanning main PRs covers everything
    # before any release tag can include it.
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Inquiry.slnx
      - name: Audit for vulnerable packages
        run: |
          output=$(dotnet list Inquiry.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
