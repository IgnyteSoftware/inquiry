name: Security

# PRs get scanned before merge; the weekly schedule refreshes the default-branch baseline.
# No push trigger — a push-to-main run would duplicate the PR scan that just gated the merge.
on:
  pull_request:
    # Trunk-based: every change PRs into main, so scanning main PRs covers everything
    # before any release tag can include it.
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: dotnet restore Inquiry.slnx
      - name: Audit for vulnerable packages
        run: |
          output=$(dotnet list Inquiry.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
