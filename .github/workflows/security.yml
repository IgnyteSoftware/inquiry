name: Security

# PRs get scanned before merge; the weekly schedule refreshes the default-branch baseline.
# No push trigger — a push-to-main run would duplicate the PR scan that just gated the merge.
on:
  pull_request:
    # Trunk-based: every change PRs into main, so scanning main PRs covers everything
    # before any release tag can include it.
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Inquiry.slnx
      - name: Audit for vulnerable packages
        run: |
          output=$(dotnet list Inquiry.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
