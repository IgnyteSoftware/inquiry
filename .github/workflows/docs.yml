name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - src/**/*.cs
      - src/**/*.csproj
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.78.5
      - name: Build site
        run: docfx docs/site/docfx.json
      - name: Validate links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Inquiry.Sqlite.html is excluded because DocFX renders the namespace breadcrumb as one
          # xref per segment, and Inquiry.Sqlite holds no public type (SQLite is the only provider
          # with no *InquiryOptions/*Compatibility pair), so DocFX emits no page for that segment.
          # Remove this exclusion if a public type is ever added to the Inquiry.Sqlite namespace.
          args: --offline --no-progress --exclude 'Inquiry\.Sqlite\.html$' docs/site/_site
          fail: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
