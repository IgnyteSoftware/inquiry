name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - name: Generator, unit & SQLite tests
        run: |
          dotnet test tests/Inquiry.Generators.Tests -c Release --no-build
          dotnet test tests/Inquiry.Tests -c Release --no-build
          dotnet test tests/Inquiry.Sqlite.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack --no-build -c Release -o nupkgs

      - name: Push to NuGet.org
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
