name: Scheduled (full TFM matrix)
on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Repeats the full three-TFM provider matrix that PRs already
    # run, re-verifying every provider against current container images.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Docker is available on GitHub runners; a silently-skipped suite must not pass a scheduled
      # verification run. See tests/Inquiry.IntegrationTesting/DockerRequirement.cs.
      INQUIRY_REQUIRE_DOCKER: "1"
      # Ephemeral runners need no resource reaper, and ryuk's Docker Hub pull is the
      # matrix's only registry-1.docker.io dependency — a recurring source of flaky legs.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, MySql, MariaDb, SqlServer, Oracle]
        tfm: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build pinned SQL Server full-text image
        if: matrix.provider == 'SqlServer'
        run: docker build --file tests/Inquiry.SqlServer.Tests/Fixtures/SqlServerFts.Dockerfile --tag inquiry-sqlserver-fts:2022-cu14 .
      - name: Preflight SQL Server image runtime user
        if: matrix.provider == 'SqlServer'
        run: |
          uid="$(docker run --rm --entrypoint /usr/bin/id inquiry-sqlserver-fts:2022-cu14 -u)"
          test -n "$uid"
          test "$uid" != "0"
          echo "SQL Server image runtime UID: $uid"
      - name: Integration tests (${{ matrix.provider }} on ${{ matrix.tfm }})
        env:
          INQUIRY_SQLSERVER_IMAGE: ${{ matrix.provider == 'SqlServer' && 'inquiry-sqlserver-fts:2022-cu14' || '' }}
        run: dotnet test tests/Inquiry.${{ matrix.provider }}.Tests/Inquiry.${{ matrix.provider }}.Tests.csproj -c Release -f ${{ matrix.tfm }} --logger "trx;LogFileName=${{ matrix.provider }}-${{ matrix.tfm }}.trx" --results-directory test-results
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scheduled-integration-${{ matrix.provider }}-${{ matrix.tfm }}
          path: test-results/
