name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A superseded push to the same PR cancels the in-flight matrix; merge-group runs are never
# cancelled because the queue's verdict is the merge gate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Verify release and required-check manifests
        run: |
          dotnet run --project eng/Inquiry.ReleaseTools/Inquiry.ReleaseTools.csproj --configuration Release --no-build -- verify-manifest . eng/release-manifest.json
          dotnet run --project eng/Inquiry.ReleaseTools/Inquiry.ReleaseTools.csproj --configuration Release --no-build -- verify-ci . eng/ci-required-v1.json .github/workflows/ci.yml
          dotnet test tests/Inquiry.ReleaseTools.Tests/Inquiry.ReleaseTools.Tests.csproj --configuration Release --no-build
      - name: Generator, unit & SQLite tests
        run: |
          dotnet test tests/Inquiry.Benchmarks.Contracts.Tests/Inquiry.Benchmarks.Contracts.Tests.csproj -c Release --no-build --logger "trx;LogFileName=benchmark-contracts.trx" --results-directory test-results
          dotnet test tests/Inquiry.Generators.Tests/Inquiry.Generators.Tests.csproj -c Release --no-build --logger "trx;LogFileName=generators.trx" --results-directory test-results
          dotnet test tests/Inquiry.Tests/Inquiry.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory test-results
          dotnet test tests/Inquiry.Sqlite.Tests/Inquiry.Sqlite.Tests.csproj -c Release --no-build --logger "trx;LogFileName=sqlite.trx" --results-directory test-results
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  aot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish AOT smoke app
        run: dotnet publish samples/Inquiry.AotSmoke/Inquiry.AotSmoke.csproj -c Release -r linux-x64 -o aot-out
      - name: Run native binary
        run: |
          out=$(./aot-out/Inquiry.AotSmoke)
          echo "$out"
          echo "$out" | grep -q "AOT-SMOKE-OK"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INQUIRY_REQUIRE_DOCKER: 1
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, MySql, MariaDb, SqlServer, Oracle]
        tfm: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build pinned SQL Server full-text image
        if: matrix.provider == 'SqlServer'
        run: docker build --file tests/Inquiry.SqlServer.Tests/Fixtures/SqlServerFts.Dockerfile --tag inquiry-sqlserver-fts:2022-cu14 .
      - name: Preflight SQL Server image runtime user
        if: matrix.provider == 'SqlServer'
        run: |
          uid="$(docker run --rm --entrypoint /usr/bin/id inquiry-sqlserver-fts:2022-cu14 -u)"
          test -n "$uid"
          test "$uid" != "0"
          echo "SQL Server image runtime UID: $uid"
      - name: Integration tests (${{ matrix.provider }} on ${{ matrix.tfm }})
        env:
          INQUIRY_SQLSERVER_IMAGE: ${{ matrix.provider == 'SqlServer' && 'inquiry-sqlserver-fts:2022-cu14' || '' }}
        run: |
          dotnet test tests/Inquiry.${{ matrix.provider }}.Tests/Inquiry.${{ matrix.provider }}.Tests.csproj -c Release -f ${{ matrix.tfm }} --logger "trx;LogFileName=${{ matrix.provider }}-${{ matrix.tfm }}.trx" --results-directory test-results
          if [ "${{ matrix.provider }}" = "SqlServer" ]; then
            dotnet test tests/Inquiry.Benchmarks.SqlServer.Tests/Inquiry.Benchmarks.SqlServer.Tests.csproj -c Release -f ${{ matrix.tfm }} --logger "trx;LogFileName=SqlServer-collection-${{ matrix.tfm }}.trx" --results-directory test-results
          fi
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results-${{ matrix.provider }}-${{ matrix.tfm }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build benchmarks (Release)
        run: |
          dotnet build benchmarks/Inquiry.Benchmarks/Inquiry.Benchmarks.csproj -c Release
          dotnet build benchmarks/Inquiry.Benchmarks.RegressionGate/Inquiry.Benchmarks.RegressionGate.csproj -c Release
      - name: Smoke-run one benchmark (dry run)
        run: |
          dotnet run --project benchmarks/Inquiry.Benchmarks/Inquiry.Benchmarks.csproj -c Release -f net8.0 -- \
            --filter "*ShipperCrudBenchmarks.SelectAll_AdoNet*" \
            --job Dry \
            --exporters json

  package-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Pack and verify the exact manifest inventory
        shell: pwsh
        run: ./eng/pack-release.ps1 -OutputPath "$env:RUNNER_TEMP/package-contract" -Commit $env:GITHUB_SHA
      - name: Attest build provenance
        # Attestation persistence is unavailable for private repos on this org's plan; enable the
        # repo variable (or make the repo public) to turn it back on.
        if: vars.ENABLE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ${{ runner.temp }}/package-contract/*.nupkg
      - name: Upload package bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-contract/
          if-no-files-found: error
          retention-days: 30
      - name: Validate immutable artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          echo "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'

  package-verifier:
    needs: [package-producer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Verify the stored artifact archive digest
        env:
          ARTIFACT_ID: ${{ needs.package-producer.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.package-producer.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$ARTIFACT_ID" | grep -Eq '^[0-9]+$'
          echo "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          curl --fail --silent --show-error --retry 3 --max-redirs 0 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --dump-header artifact.headers --output /dev/null
          artifact_url="$(sed -n 's/^location: //Ip' artifact.headers | tr -d '\r')"
          case "$artifact_url" in https://*) ;; *) exit 1 ;; esac
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$artifact_url" --output artifact.zip
          echo "$ARTIFACT_DIGEST  artifact.zip" | sha256sum --check --strict
      - name: Download the producer artifact by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package-producer.outputs.artifact-id }}
          path: .artifacts/downloaded
          merge-multiple: true
      - name: Validate producer digest identity and downloaded bytes
        env:
          ARTIFACT_DIGEST: ${{ needs.package-producer.outputs.artifact-digest }}
        run: |
          echo "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          dotnet run --project eng/Inquiry.ReleaseTools/Inquiry.ReleaseTools.csproj --configuration Release -- verify-bundle . eng/release-manifest.json .artifacts/downloaded "$GITHUB_SHA"

  ci-required-v1:
    name: ci-required-v1
    if: always()
    needs: [build-and-unit, aot-smoke, integration, benchmark-smoke, package-producer, package-verifier]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce every required job and matrix leg
        env:
          BUILD_AND_UNIT_RESULT: ${{ needs.build-and-unit.result }}
          AOT_SMOKE_RESULT: ${{ needs.aot-smoke.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BENCHMARK_SMOKE_RESULT: ${{ needs.benchmark-smoke.result }}
          PACKAGE_PRODUCER_RESULT: ${{ needs.package-producer.result }}
          PACKAGE_VERIFIER_RESULT: ${{ needs.package-verifier.result }}
        run: |
          test "$BUILD_AND_UNIT_RESULT" = success
          test "$AOT_SMOKE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$BENCHMARK_SMOKE_RESULT" = success
          test "$PACKAGE_PRODUCER_RESULT" = success
          test "$PACKAGE_VERIFIER_RESULT" = success
