name: CI
on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Emit TRX so failures land in artifacts even when the build host has no other inspection
      # surface; the per-project --results-directory keeps file paths from colliding across TFMs.
      - name: Generator, unit & SQLite tests
        run: |
          dotnet test tests/Inquiry.Generators.Tests/Inquiry.Generators.Tests.csproj -c Release --no-build --logger "trx;LogFileName=generators.trx" --results-directory test-results
          dotnet test tests/Inquiry.Tests/Inquiry.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory test-results
          dotnet test tests/Inquiry.Sqlite.Tests/Inquiry.Sqlite.Tests.csproj -c Release --no-build --logger "trx;LogFileName=sqlite.trx" --results-directory test-results
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: test-results/

  aot-smoke:
    # Verifies the NativeAOT story end-to-end: publish the smoke app as a native binary
    # (trim/AOT analyzer warnings surface here) and run its generated-store CRUD pass.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish AOT smoke app
        run: dotnet publish samples/Inquiry.AotSmoke/Inquiry.AotSmoke.csproj -c Release -r linux-x64 -o aot-out
      - name: Run native binary
        run: |
          out=$(./aot-out/Inquiry.AotSmoke)
          echo "$out"
          echo "$out" | grep -q "AOT-SMOKE-OK"

  integration:
    runs-on: ubuntu-latest
    # Oracle's container warmup is ~3 minutes; 40 mins is the existing budget that was
    # previously used by the nightly Oracle-only workflow. The other three providers each
    # finish in 1-2 minutes — matrix legs run in parallel, so the wall-clock cost of adding
    # Oracle here is just its own slot, not slower CI overall.
    timeout-minutes: 40
    env:
      # A provider suite that can't start its container must FAIL here, not silently skip and leave CI
      # green (GitHub runners have Docker). See tests/Inquiry.IntegrationTesting/DockerRequirement.cs.
      INQUIRY_REQUIRE_DOCKER: "1"
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, MySql, MariaDb, SqlServer, Oracle]
        # net8.0 is the LTS baseline every provider supports; net9.0 catches regressions on the
        # current STS. net10.0 builds in the unit job; no point spinning a Testcontainer per
        # provider × per extra TFM (audit P2 #10).
        tfm: [net8.0, net9.0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Integration tests (${{ matrix.provider }} on ${{ matrix.tfm }})
        run: dotnet test tests/Inquiry.${{ matrix.provider }}.Tests/Inquiry.${{ matrix.provider }}.Tests.csproj -c Release -f ${{ matrix.tfm }} --logger "trx;LogFileName=${{ matrix.provider }}-${{ matrix.tfm }}.trx" --results-directory test-results
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results-${{ matrix.provider }}-${{ matrix.tfm }}
          path: test-results/
