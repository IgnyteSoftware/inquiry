name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Generator, unit & SQLite tests
        run: |
          dotnet test tests/Inquiry.Generators.Tests/Inquiry.Generators.Tests.csproj -c Release --no-build
          dotnet test tests/Inquiry.Tests/Inquiry.Tests.csproj -c Release --no-build
          dotnet test tests/Inquiry.Sqlite.Tests/Inquiry.Sqlite.Tests.csproj -c Release --no-build

  integration:
    runs-on: ubuntu-latest
    # Oracle's container warmup is ~3 minutes; 40 mins is the existing budget that was
    # previously used by the nightly Oracle-only workflow. The other three providers each
    # finish in 1-2 minutes — matrix legs run in parallel, so the wall-clock cost of adding
    # Oracle here is just its own slot, not slower CI overall.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, MySql, SqlServer, Oracle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Integration tests (${{ matrix.provider }})
        run: dotnet test tests/Inquiry.${{ matrix.provider }}.Tests/Inquiry.${{ matrix.provider }}.Tests.csproj -c Release -f net8.0
